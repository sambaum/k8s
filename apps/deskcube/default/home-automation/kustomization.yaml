resources:
- ../../../base/default/home-automation/

patches:
- target:
    kind: HelmRelease
    name: home-assistant
  patch: |-
    - op: replace
      path: /spec/values/ingress/hosts/0/host
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/tls/0/hosts/0
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
    # Serve plain HTTP as well as HTTPS.
    # HA's internal_url is http://, and TTS media URLs are generated from it:
    # old media renderers fetch them over plain HTTP more reliably than TLS,
    # and ESPHome players in particular would rather not pay for a handshake
    # inside their fetch budget.
    - op: add
      path: /spec/values/ingress/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
      value: "false"
    # The TTS cache (/config/tts) goes to /data/default/home-assistant/tts
    # rather than the backed-up conf volume: it is regenerated on demand.
    # Pre-rendered stories come from the NAS (other/HA/stories), where the
    # renderer writes them: mp3s served as /local/stories, scene graphs
    # imported as stories/rendered.jinja.
    - op: add
      path: /spec/values/additionalVolumes
      value:
      - name: data
        persistentVolumeClaim:
          claimName: local-data-pvc
      - name: nas-other
        persistentVolumeClaim:
          claimName: truenas-other-pvc
    - op: add
      path: /spec/values/additionalMounts
      value:
      - name: data
        mountPath: /config/tts
        subPath: home-assistant/tts
      - name: nas-other
        mountPath: /config/www/stories
        subPath: HA/stories/audio
        readOnly: true
      - name: nas-other
        mountPath: /config/custom_templates/stories
        subPath: HA/stories/templates
        readOnly: true
- target:
    kind: Ingress
    name: zigbee2mqtt-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: zigbee2mqtt.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [zigbee2mqtt.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
