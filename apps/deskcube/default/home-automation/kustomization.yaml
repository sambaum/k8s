resources:
- ../../../base/default/home-automation/

patches:
- target:
    kind: HelmRelease
    name: home-assistant
  patch: |-
    - op: replace
      path: /spec/values/ingress/hosts/0/host
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/tls/0/hosts/0
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
    # Serve plain HTTP as well as HTTPS, instead of 308-ing port 80 to TLS.
    # The Chromecast Audio in the living room can't validate a Let's Encrypt
    # cert -- its trust store was frozen before ISRG Root X1 became the only
    # path, so every TTS fetch over HTTPS fails silently. HA's internal_url is
    # http:// for the same reason, and TTS media URLs are generated from it.
    # HTTPS is untouched; this only stops the redirect.
    - op: add
      path: /spec/values/ingress/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
      value: "false"
- target:
    kind: Ingress
    name: zigbee2mqtt-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: zigbee2mqtt.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [zigbee2mqtt.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
