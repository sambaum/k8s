resources:
- ../../../base/default/home-automation/

patches:
- target:
    kind: HelmRelease
    name: home-assistant
  patch: |-
    - op: replace
      path: /spec/values/ingress/hosts/0/host
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/tls/0/hosts/0
      value: homeassistant.int.sambaum.ch
    - op: replace
      path: /spec/values/ingress/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
    # Serve plain HTTP as well as HTTPS.
    # HA's internal_url is http://, and TTS media URLs are generated from it:
    # old media renderers fetch them over plain HTTP more reliably than TLS,
    # and ESPHome players in particular would rather not pay for a handshake
    # inside their fetch budget.
    - op: add
      path: /spec/values/ingress/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
      value: "false"
- target:
    kind: Ingress
    name: zigbee2mqtt-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: zigbee2mqtt.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [zigbee2mqtt.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
