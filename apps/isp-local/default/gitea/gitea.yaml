apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: default
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
      - name: gitea
        image: gitea/gitea:1.27.3
        ports:
        - containerPort: 3000
        - containerPort: 22
        env:
        - name: TZ
          value: 'Europe/Zurich'
        - name: USER_UID
          value: '1000'
        - name: USER_GID
          value: '1000'
        - name: GITEA__database__DB_TYPE
          value: sqlite3
        - name: GITEA__server__ROOT_URL
          value: http://gitea.lab.local/
        - name: GITEA__server__DOMAIN
          value: gitea.lab.local
        - name: GITEA__server__SSH_DOMAIN
          value: ws526-vm
        - name: GITEA__server__SSH_PORT
          value: '2222'
        - name: GITEA__server__SSH_LISTEN_PORT
          value: '22'
        - name: GITEA__security__INSTALL_LOCK
          value: 'true'
        - name: GITEA__service__DISABLE_REGISTRATION
          value: 'true'
        volumeMounts:
        - mountPath: /data
          name: config
          subPath: gitea
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: local-conf-pvc
      dnsConfig:
        options:
        - name: ndots
          value: "1"
---
kind: Service
apiVersion: v1
metadata:
  name: gitea-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 22
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    gethomepage.dev/description: Git Server
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: More Apps
    gethomepage.dev/icon: gitea.svg
    gethomepage.dev/name: Gitea
    gethomepage.dev/pod-selector: app=gitea
spec:
  ingressClassName: nginx
  rules:
  - host: gitea.lab.local
    http:
      paths:
      - pathType: Prefix
        path: '/'
        backend:
          service:
            name: gitea-service
            port:
              number: 3000
