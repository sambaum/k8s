resources:
- ../../../base/default/headers/
patches:
- target:
    kind: Ingress
    name: headers-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: headers.lab.local
    - op: replace
      path: /spec/tls/0/hosts
      value: [headers.lab.local]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-staging
    - op: remove
      path: /spec/tls
