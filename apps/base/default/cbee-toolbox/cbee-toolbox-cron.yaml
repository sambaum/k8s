apiVersion: batch/v1
kind: CronJob
metadata:
  name: cbee-toolbox-job
  namespace: default
spec:
  schedule: "9 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            # runs as root: pip installs into the stock image and the PVC files are root-owned
            polaris.fairwinds.com/runAsRootAllowed-exempt: "true"
            polaris.fairwinds.com/runAsPrivileged-exempt: "true"
            polaris.fairwinds.com/notReadOnlyRootFilesystem-exempt: "true"
            polaris.fairwinds.com/privilegeEscalationAllowed-exempt: "true"
        spec:
          containers:
          - name: cbee-toolbox-job
            image: python:3.14-slim
            imagePullPolicy: IfNotPresent
            command: [ "/app/entrypoint.sh", "check", "--fetch" ]
            env:
            - name: TZ
              value: Europe/Zurich
            volumeMounts:
            - mountPath: /app
              name: config
              subPath: cbee-toolbox
          restartPolicy: OnFailure
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: local-conf-pvc
