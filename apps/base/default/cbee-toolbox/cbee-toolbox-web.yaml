apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbee-toolbox
  namespace: default
  labels:
    app: cbee-toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cbee-toolbox
  template:
    metadata:
      labels:
        app: cbee-toolbox
      annotations:
        # runs as root: pip installs into the stock image and the PVC files are root-owned
        polaris.fairwinds.com/runAsRootAllowed-exempt: "true"
        polaris.fairwinds.com/runAsPrivileged-exempt: "true"
        polaris.fairwinds.com/notReadOnlyRootFilesystem-exempt: "true"
        polaris.fairwinds.com/privilegeEscalationAllowed-exempt: "true"
    spec:
      # a restart asks running tasks to stop after their current item (up to 100 s, see app/__main__.py)
      terminationGracePeriodSeconds: 120
      containers:
      - name: cbee-toolbox
        image: python:3.15-slim
        imagePullPolicy: IfNotPresent
        command: [ "/app/entrypoint.sh", "serve" ]
        env:
        - name: TZ
          value: Europe/Zurich
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - mountPath: /app
          name: config
          subPath: cbee-toolbox
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: local-conf-pvc
      dnsConfig:
        options:
        - name: ndots
          value: "1"
---
kind: Service
apiVersion: v1
metadata:
  name: cbee-toolbox-service
  namespace: default
spec:
  selector:
    app: cbee-toolbox
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbee-toolbox-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    gethomepage.dev/description: Spelling, consistency, health checks and bulk tools for the cbee.ch WooCommerce shop
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: More Apps
    gethomepage.dev/icon: https://cbee-toolbox.int.sambaum.ch/static/favicon.png
    gethomepage.dev/name: cbee-toolbox
    gethomepage.dev/pod-selector: app=cbee-toolbox
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - 'cbee-toolbox.example.com'
    secretName: cbee-toolbox-tls
  rules:
  - host: cbee-toolbox.example.com
    http:
      paths:
      - pathType: Prefix
        path: '/'
        backend:
          service:
            name: cbee-toolbox-service
            port:
              number: 80
