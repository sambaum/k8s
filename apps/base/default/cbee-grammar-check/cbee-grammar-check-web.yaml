apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbee-grammar-check
  namespace: default
  labels:
    app: cbee-grammar-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cbee-grammar-check
  template:
    metadata:
      labels:
        app: cbee-grammar-check
      annotations:
        # runs as root: pip installs into the stock image and the PVC files are root-owned
        polaris.fairwinds.com/runAsRootAllowed-exempt: "true"
        polaris.fairwinds.com/runAsPrivileged-exempt: "true"
        polaris.fairwinds.com/notReadOnlyRootFilesystem-exempt: "true"
        polaris.fairwinds.com/privilegeEscalationAllowed-exempt: "true"
    spec:
      containers:
      - name: cbee-grammar-check
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: [ "/app/entrypoint.sh", "serve" ]
        env:
        - name: TZ
          value: Europe/Zurich
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - mountPath: /app
          name: config
          subPath: cbee-grammar-check
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: local-conf-pvc
      dnsConfig:
        options:
        - name: ndots
          value: "1"
---
kind: Service
apiVersion: v1
metadata:
  name: cbee-grammar-check-service
  namespace: default
spec:
  selector:
    app: cbee-grammar-check
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbee-grammar-check-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    gethomepage.dev/description: LanguageTool check of WooCommerce product names
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: More Apps
    gethomepage.dev/icon: https://cbee.ch/wp-content/uploads/2025/04/pumphose-aus-musselin-mit-hasen-gr6268-neu-600x600.jpg
    gethomepage.dev/name: cbee-grammar-check
    gethomepage.dev/pod-selector: app=cbee-grammar-check
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - 'cbee-grammar-check.example.com'
    secretName: cbee-grammar-check-tls
  rules:
  - host: cbee-grammar-check.example.com
    http:
      paths:
      - pathType: Prefix
        path: '/'
        backend:
          service:
            name: cbee-grammar-check-service
            port:
              number: 80
