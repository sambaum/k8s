apiVersion: apps/v1
kind: Deployment
metadata:
  name: espconnect
  namespace: default
  labels:
    app: espconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: espconnect
  template:
    metadata:
      labels:
        app: espconnect
    spec:
      containers:
      - name: espconnect
        image: ponyony/espconnect:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: TZ
          value: 'Europe/Zurich'
      dnsConfig:
        options:
        - name: ndots
          value: "1"
---
kind: Service
apiVersion: v1
metadata:
  name: espconnect-service
  namespace: default
spec:
  selector:
    app: espconnect
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: espconnect-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    gethomepage.dev/description: Browser-based ESP32/ESP8266 control center (WebSerial/WebUSB)
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: More Apps
    gethomepage.dev/icon: esphome.svg
    gethomepage.dev/name: ESPConnect
    gethomepage.dev/pod-selector: app=espconnect
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - 'espconnect.example.com'
    secretName: espconnect-tls
  rules:
  - host: espconnect.example.com
    http:
      paths:
      - pathType: Prefix
        path: '/'
        backend:
          service:
            name: espconnect-service
            port:
              number: 80
