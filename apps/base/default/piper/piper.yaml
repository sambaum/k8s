# Piper speaks the WYOMING protocol - plain TCP, not HTTP - so there is no ingress
# and no certificate here, just a MetalLB address. Nothing on the ESP32 side
# changes: the devices still fetch rendered audio from Home Assistant's proxy.
#
# IT RUNS ON THE **home** CLUSTER, NOT NEXT TO HOME ASSISTANT. Measured on the
# deskcube Celeron a single sentence took 10-20s at 100% CPU - three to five
# times realtime - on the same four cores Home Assistant needs. The i7 does the
# same work in well under a second. The cost is that speech now depends on a
# second machine being up, which is an acceptable trade for a bedside clock.
#
# --voice below is only the DEFAULT, not a limit. handler.py takes the voice name
# off each synthesize request when one is given, and calls ensure_voice_exists()
# to fetch it, so this one deployment can speak any of Piper's ~155 voices across
# 43 languages. Home Assistant picks per call. It also resolves a speaker id,
# which is what makes the multi-speaker models (VCTK, LibriTTS) usable.
#
# Each voice is downloaded on first use into the mounted volume, so the pod needs
# internet the first time it is asked for one and is offline thereafter.
#
# Voice names are <language>-<speaker>-<quality>, e.g. en_GB-alba-medium or
# de_DE-thorsten-medium. Quality is x_low, low, medium or high; medium is the
# sensible default, and high costs noticeably more CPU for little gain over a
# small speaker. Samples: https://rhasspy.github.io/piper-samples/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: default
  labels:
    app.kubernetes.io/name: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: piper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piper
    spec:
      containers:
      - name: piper
        image: rhasspy/wyoming-piper:2.5.2
        # ONE value only - --voice is the fallback for calls that name no voice,
        # not a list of what is available. Anything else here would be parsed as
        # a positional argument and the container would refuse to start.
        #
        # The shortlist worth trying, any of which can be asked for per call via
        # the `voice:` option on tts.speak, and is downloaded on first use:
        #   en_GB-alba-medium
        #   en_GB-aru-medium
        #   en_GB-cori-high
        #   en_GB-semaine-medium
        #   en_GB-northern_english_male-medium
        #   en_US-joe-medium
        #   en_US-l2arctic-medium              (Indian accent)
        #   en_US-norman-medium
        #   en_US-ryan-high
        args:
        - --voice
        # default voice
        - en_GB-alba-medium
        # talking speed (1.1 is slower)
        - --length-scale
        - "1.1"
        env:
        - name: TZ
          value: Europe/Zurich
        ports:
        - containerPort: 10200
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: piper
        readinessProbe:
          tcpSocket:
            port: 10200
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: local-conf-pvc
      dnsConfig:
        options:
        - name: ndots
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: default
  annotations:
    metallb.universe.tf/allow-shared-ip: 'share-syslog-ng'
spec:
  type: LoadBalancer
  loadBalancerIP: '${PIPER_LOADBALANCER_IP}'
  selector:
    app.kubernetes.io/name: piper
  ports:
  - protocol: TCP
    port: 10200
    targetPort: 10200
