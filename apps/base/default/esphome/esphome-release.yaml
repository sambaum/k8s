apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: default
spec:
  releaseName: esphome
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: '5.1.0'
  interval: 30m
  install:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        pod:
          dnsPolicy: None
          dnsConfig:
            nameservers:
            - 192.168.1.1
            options:
            - name: ndots
              value: "1"
        containers:
          main:
            image:
              repository: ghcr.io/esphome/esphome
              # Pinned intentionally - upgrade deliberately, not on every reconcile.
              tag: "2026.4.1"
              pullPolicy: IfNotPresent
            env:
              TZ: "Europe/Zurich"
              ESPHOME_DASHBOARD_USE_PING: "true"
              # Force git protocol v0 for every git call the dashboard makes.
              # Remote `packages:` and `external_components:` are fetched by cloning,
              # and from this pod that failed with "expected flush after ref listing"
              # while the same repo listed fine from the host - the signature of
              # protocol v2 being mangled in transit. v0 avoids the negotiation
              # entirely. Ignored harmlessly by git < 2.31.
              GIT_CONFIG_COUNT: "1"
              GIT_CONFIG_KEY_0: "protocol.version"
              GIT_CONFIG_VALUE_0: "0"
    persistence:
      config:
        existingClaim: local-conf-pvc
        globalMounts:
        - path: /config
          subPath: esphome
      cache:
        existingClaim: local-data-pvc
        globalMounts:
        - path: /config/.esphome
          subPath: esphome-cache
    service:
      main:
        controller: main
        ports:
          http:
            port: 6052
    ingress:
      main:
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging
          gethomepage.dev/description: ESPHome Dashboard
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: More Apps
          gethomepage.dev/icon: esphome.svg
          gethomepage.dev/name: ESPHome
          gethomepage.dev/pod-selector: app.kubernetes.io/name=esphome
        hosts:
        - host: esphome.example.com
          paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
        tls:
        - hosts:
          - esphome.example.com
          secretName: esphome-tls
