resources:
- ../../../base/default/story-designer/
patches:
- target:
    kind: Ingress
    name: story-designer-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: story-designer.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [story-designer.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
