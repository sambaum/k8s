resources:
- ../../../base/default/cbee-toolbox/
patches:
- target:
    kind: Ingress
    name: cbee-toolbox-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: cbee-toolbox.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [cbee-toolbox.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
