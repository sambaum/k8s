resources:
- ../../../base/default/metube/
patches:
- target:
    kind: Ingress
    name: metube-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: metube.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [metube.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
