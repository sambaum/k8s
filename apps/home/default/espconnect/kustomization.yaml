resources:
- ../../../base/default/espconnect/

patches:
- target:
    kind: Ingress
    name: espconnect-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: espconnect.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [espconnect.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
