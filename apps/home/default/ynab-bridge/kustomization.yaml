resources:
- ../../../base/default/ynab-bridge/
patches:
- target:
    kind: Ingress
    name: ynab-bridge-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: ynab-bridge.int.sambaum.ch
    - op: replace
      path: /spec/tls/0/hosts
      value: [ynab-bridge.int.sambaum.ch]
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-production
